<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoneyMap</title>
  </head>
  <body>
    <header>
      <h1>💰MoneyMap</h1>
    </header>
    <section>
      <div class="new-expense-header">
        <span>➕</span>
        <h3>Add a New Expense</h3>
      </div>
      <form id="expense-form">
        <div class="expense-name">
          <label for="expense-name">Expense Name</label>
          <input type="text" id="expense-name" name="expense-name" required />
        </div>
        <div class="expense-amount">
          <label for="expense-amount">Amount</label>

          <div class="amount-input-wrapper">
            <span class="currency-symbol">$</span>
            <input
              type="number"
              id="expense-amount"
              min="0.01"
              step="0.01"
              name="expense-amount"
              required
            />
          </div>
        </div>
        <div class="expense-category">
          <label for="expense-category">Category</label>
          <select id="expense-category" name="expense-category" required>
            <option value="">Select a category</option>
            <option value="Food">Food</option>
            <option value="Transportation">Transportation</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Bill">Bill</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="expense-date">
          <label for="expense-date">Date</label>
          <input type="date" id="expense-date" name="expense-date" required />
        </div>
        <div class="button-container">
          <button type="submit">Add Expense</button>
        </div>
      </form>
    </section>
    <section>
      <div class="expenses-header">
        <div class="expenses-title">
          <span>📋</span>
          <h3>My Expenses</h3>
        </div>
        <div class="spending-summary">
          <h3>Total Spending</h3>
          <p id="total-spending">$0.00</p>
        </div>
      </div>
      <div id="expenses-list">
        <table>
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Amount</th>
              <th scope="col">Category</th>
              <th scope="col">Date</th>
              <th scope="col">Delete</th>
            </tr>
          </thead>
          <tbody id="expenses-table-body"></tbody>
        </table>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
